# Railway builds the repo-root Dockerfile (not Nixpacks) and checks /health.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Drops to user keyshare, then runs `keyshare-mcp serve <config>`.
# Uses KEYSHARE_TOML when that variable is set.
startCommand = "/usr/local/bin/keyshare-entrypoint"
healthcheckPath = "/health"
healthcheckTimeout = 120
