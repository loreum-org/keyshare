[package]
name = "keyshare-mcp"
description = "MCP connector for keyshare wallets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
keyshare-core = { path = "../keyshare-core" }
keyshare-hyperliquid = { path = "../keyshare-hyperliquid" }
keyshare-module = { path = "../keyshare-module" }
keyshare-signer = { path = "../keyshare-signer" }
keyshare-uniswap = { path = "../keyshare-uniswap" }
alloy = { workspace = true, features = ["provider-http", "reqwest-rustls-tls", "rpc-types", "network"] }
axum = "0.8"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
